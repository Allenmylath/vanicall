# Separate Fly app from the signaling server on purpose.
#
# The main `vanicall` app is a deliberately small JSON relay (shared-cpu-2x/1gb) with
# auto_stop_machines enabled — it does no media and no crypto. ffmpeg is the opposite: sustained
# CPU, and a machine that must not be stopped while a stream is open. Putting it in that app would
# undo the right-sizing and let autostop kill live feeds.
#
# Deploy from the REPO ROOT (the image needs ../ingest-lib):
#   fly deploy -c ingest-worker/fly.toml --dockerfile ingest-worker/Dockerfile .
#
# The trailing `.` is load-bearing: it makes the repo root the build context, which the image needs
# because it builds ingest-lib from source. There is deliberately no [build] section — that would
# root the context at this directory instead, and the build would fail on the missing ingest-lib.

app = 'vanicall-ingest'
primary_region = 'bom'

[env]
  PORT = '8090'
  VANICALL_API_URL = 'https://vanicall.fly.dev'
  # Proportionate to the 1gb below: each concurrent stream is a real ffmpeg transcode. Raise this
  # together with the VM, not on its own.
  MAX_JOBS = '2'

[http_service]
  internal_port = 8090
  force_https = true
  # A running stream is state this machine holds; stopping it kills every feed. Unlike the
  # signaling server, this cannot scale to zero while it has work.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

# Each concurrent stream is a real ffmpeg transcode, so size for MAX_JOBS rather than for idle.
# Starts at the same shape as the signaling app, which is known to place in bom — shared-cpu-2x
# with 2gb currently has no capacity there. Scale up once it is running and you need more streams:
#   fly scale vm shared-cpu-4x --memory 2048 -a vanicall-ingest
# and raise MAX_JOBS to match.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
