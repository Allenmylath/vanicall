# fly.toml app configuration file generated for vanicall on 2026-06-22T16:27:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vanicall'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  # No RECONCILE_INTERVAL_SECS: the reconciler runs ONE pass and exits (one-shot), because it is a
  # scheduled machine now, not an always-on loop — see the [processes] note below. RECONCILE_SETTLE
  # still applies to each run.
  RECONCILE_SETTLE_SECS = '300'
  RUST_LOG = 'info,tower_http=info'

[processes]
  web = 'vanicall'

# The reconciler is NOT a process group here anymore. As a process group it was an always-on loop
# (RECONCILE_INTERVAL_SECS) — a machine running while nothing happened. It is now a SCHEDULED
# machine that wakes hourly, bills whatever ended, and stops, so it costs nothing between runs.
# It is created once, separately from `fly deploy`, and reuses this app's image and env:
#
#   fly machine run . /usr/local/bin/reconcile #     --schedule hourly --vm-size shared-cpu-1x --vm-memory 512 -a vanicall
#
# WARNING: `fly deploy` with this config DESTROYS the old always-on reconciler machine. Billing
# does not run again until the scheduled machine above is created. Do both in the same sitting.

[http_service]
  internal_port = 8080
  force_https = true
  # Exactly ONE web machine may exist. The relay/roster state (Presence + per-room fan-out
  # channels) is in-memory per process, so all members of a room MUST share one machine; a second
  # web machine would split rooms and break the E2EE relay. Enforce with: fly scale count web=1.
  # That invariant is about machine *count*, not uptime — autostart only ever wakes the one
  # machine in the pool, so scaling to zero is compatible with it.
  #
  # min_machines_running = 0 is safe because the in-memory state only matters while someone is
  # connected: no connections means no roster to lose. While a call IS live the socket heartbeat
  # (see HEARTBEAT_INTERVAL in src/main.rs) puts a frame on the wire every 30s, so an idle call
  # can never look like an idle machine. Cost: a cold start (~1-2s, plus Neon's own wake) on the
  # first request after a quiet period.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['web']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

# Signaling/relay only: no media and no crypto touch this process (media goes browser->Cloudflare
# SFU, MLS runs in the browser). Per-member state is a roster entry plus a channel, and the CF API
# round-trips are spawned, so this is I/O-bound with episodic bursts — the profile shared CPU burst
# is built for. Bump to performance-1x if throttling ever shows up as signaling jitter.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  processes = ['web']
